name: Fuzz

# Daily fuzz run for the cargo-fuzz harnesses under fuzz/. Splits the
# 30-minute total budget across the auto-discovered targets (see
# fuzz/Cargo.toml for the target inventory: the syncinfo/BSI header
# parsers, the stateful AC-3 / E-AC-3 packet -> PCM decode path, the
# Annex E substream walker, and the structure-aware encode -> decode
# round trip).

on:
  schedule:
    - cron: "37 5 * * *"   # daily 05:37 UTC, jittered off the hour
  workflow_dispatch:

jobs:
  fuzz:
    uses: OxideAV/.github/.github/workflows/crate-fuzz.yml@master
    with:
      time_budget_seconds: 1800
    secrets: inherit
